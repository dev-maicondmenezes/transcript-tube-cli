name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  GO_VERSION: "1.23"

jobs:
  prepare:
    name: release/prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      core: ${{ steps.version.outputs.core }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Read versions
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          core="$(tr -d '[:space:]' < CORE_VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION inválido: $version"
            exit 1
          fi
          if ! printf '%s' "$core" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::CORE_VERSION inválido: $core (esperado vX.Y.Z)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "core=$core" >> "$GITHUB_OUTPUT"
      - name: Check existing tag
        id: check
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait for core tag
        if: steps.check.outputs.exists == 'false'
        env:
          CORE_VERSION: ${{ steps.version.outputs.core }}
        run: |
          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            if git ls-remote --exit-code --tags \
              https://github.com/dev-maicondmenezes/transcript-tube-core.git \
              "refs/tags/${CORE_VERSION}" >/dev/null 2>&1; then
              echo "tag do core disponível: ${CORE_VERSION}"
              exit 0
            fi
            echo "aguardando tag ${CORE_VERSION} do core..."
            sleep 20
          done
          echo "::error::tag ${CORE_VERSION} do transcript-tube-core não encontrada após 30 minutos"
          exit 1
      - name: Wait for core module in the Go proxy
        if: steps.check.outputs.exists == 'false'
        env:
          CORE_VERSION: ${{ steps.version.outputs.core }}
        run: |
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            if go mod download "github.com/dev-maicondmenezes/transcript-tube-core@${CORE_VERSION}"; then
              echo "módulo do core disponível: ${CORE_VERSION}"
              exit 0
            fi
            echo "aguardando o proxy publicar ${CORE_VERSION}..."
            sleep 20
          done
          echo "::error::módulo github.com/dev-maicondmenezes/transcript-tube-core@${CORE_VERSION} indisponível após 10 minutos"
          exit 1
      - name: Validate module files
        if: steps.check.outputs.exists == 'false'
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod/go.sum desatualizados para o CORE_VERSION. Rode 'go mod tidy' e commite no PR."
            exit 1
          fi

  publish:
    name: release/goreleaser
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Create tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "tyot $VERSION"
          git push origin "$TAG"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
